[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-jungle-web-engine"
version = "0.1.0"
description = "Browser payload tests for the GPT_CX_Jungle engine."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]

