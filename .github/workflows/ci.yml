name: CI

on:
  push:
    branches: [main, Arena-WebAssembly]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Use pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.94.1"
          target: wasm32-unknown-unknown
          components: rustfmt, clippy
          cache-workspaces: "engine -> target"

      - name: Install pinned Wasm tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.263.0,wasm-bindgen@0.2.130

      - name: Install locked web dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install "pytest>=9.0.3"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit chrome msedge

      - name: Run complete validation suite
        run: npm run test:all
