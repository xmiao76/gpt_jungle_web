[workspace]
members = [
  "crates/jungle-core",
  "crates/jungle-search",
  "crates/jungle-wasm",
  "crates/jungle-cli",
  "crates/jungle-tablebase",
]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
js-sys = "0.3.82"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
wasm-bindgen = "0.2.105"
web-sys = { version = "0.3.82", features = ["DedicatedWorkerGlobalScope", "Performance", "WorkerGlobalScope"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
