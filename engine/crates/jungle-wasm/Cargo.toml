[package]
name = "jungle-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# These features describe how the artifact was built. Runtime feature detection
# still decides whether a browser may use the corresponding implementation.
simd = []
threads = []

[dependencies]
jungle-core = { path = "../jungle-core" }
jungle-search = { path = "../jungle-search" }
jungle-tablebase = { path = "../jungle-tablebase" }
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
wasm-bindgen.workspace = true
web-sys.workspace = true

[package.metadata.wasm-pack.profile.release]
# Binaryen must validate every feature the optimized and threaded variants may
# contain. Enabling a validator feature does not add that feature to the scalar
# module; it only permits optimization when the input already uses it.
wasm-opt = [
  "-O3",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-simd",
  "--enable-threads",
]
